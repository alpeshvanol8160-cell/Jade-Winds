 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Animation</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  background: #02010c;
  font-family: Arial, sans-serif;
  color: white;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

.title {
  position: fixed;
  top: 9%;
  width: 100%;
  text-align: center;
  z-index: 2;
  pointer-events: none;
}

h1 {
  font-size: clamp(30px, 8vw, 60px);
  letter-spacing: 5px;
  background: linear-gradient(
    90deg, #55eaff, #c58aff, #ff7be5, #55eaff
  );
  background-size: 300%;
  color: transparent;
  background-clip: text;
  -webkit-background-clip: text;
  animation: glow 5s linear infinite;
  text-shadow: 0 0 30px #754cff55;
}

p {
  margin-top: 12px;
  color: #c9c6ff;
  letter-spacing: 3px;
  font-size: 12px;
}

@keyframes glow {
  to { background-position: 300%; }
}

.controls {
  position: fixed;
  bottom: 30px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 12px;
  z-index: 3;
}

button {
  padding: 12px 20px;
  border: 1px solid #8b7bff;
  border-radius: 30px;
  color: white;
  background: #211746aa;
  font-size: 14px;
  cursor: pointer;
  backdrop-filter: blur(8px);
}

button:active {
  background: #754cff;
}
</style>
</head>

<body>
<canvas id="space"></canvas>

<div class="title">
  <h1>GALAXY</h1>
  <p>EXPLORE THE INFINITE UNIVERSE</p>
</div>

<div class="controls">
  <button id="pause">⏸ Pause</button>
  <button id="speed">⚡ Speed</button>
  <button id="stars">✨ More Stars</button>
</div>

<script>
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

let w, h, cx, cy;
let particles = [];
let starCount = 450;
let paused = false;
let speed = 1;
let angle = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  w = innerWidth;
  h = innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = w / 2;
  cy = h / 2;
  createStars();
}

function createStars() {
  particles = [];
  for (let i = 0; i < starCount; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.7 + 0.2,
      a: Math.random(),
      twinkle: Math.random() * 0.04 + 0.005
    });
  }
}

function background() {
  const bg = ctx.createRadialGradient(
    cx, cy, 0, cx, cy, Math.max(w, h) * 0.8
  );
  bg.addColorStop(0, "#17113c");
  bg.addColorStop(0.45, "#09051d");
  bg.addColorStop(1, "#010108");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);
}

function drawGalaxy() {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  // Nebula glow
  for (let i = 0; i < 5; i++) {
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 100 + i * 35);
    g.addColorStop(0, "#000000");
    g.addColorStop(0.2, "#4e2cff22");
    g.addColorStop(0.55, "#e53bff12");
    g.addColorStop(1, "#00d9ff00");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, 100 + i * 35, 0, Math.PI * 2);
    ctx.fill();
  }

  // Spiral galaxy arms
  for (let arm = 0; arm < 4; arm++) {
    for (let i = 0; i < 1000; i++) {
      const t = i / 1000;
      const radius = 12 + t * Math.min(w, h) * 0.43;
      const a = t * 8 + arm * Math.PI / 2;
      const spread = (Math.random() - 0.5) * 0.025;
      const x = Math.cos(a + spread) * radius;
      const y = Math.sin(a + spread) * radius * 0.48;

      ctx.fillStyle = i % 3 === 0
        ? "rgba(91,220,255,0.7)"
        : i % 3 === 1
        ? "rgba(218,128,255,0.65)"
        : "rgba(255,255,255,0.7)";

      ctx.beginPath();
      ctx.arc(x, y, Math.random() * 1.5 + 0.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Bright galactic core
  const core = ctx.createRadialGradient(0, 0, 0, 0, 0, 55);
  core.addColorStop(0, "#ffffff");
  core.addColorStop(0.08, "#fff4c4");
  core.addColorStop(0.25, "#c99aff");
  core.addColorStop(0.55, "#744aff55");
  core.addColorStop(1, "#744aff00");
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(0, 0, 55, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawStars() {
  for (const s of particles) {
    s.a += s.twinkle;
    const opacity = 0.3 + Math.abs(Math.sin(s.a)) * 0.7;
    ctx.fillStyle = `rgba(220,235,255,${opacity})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function animate() {
  if (!paused) {
    background();
    drawStars();
    drawGalaxy();
    angle += 0.002 * speed;
  }
  requestAnimationFrame(animate);
}

document.getElementById("pause").onclick = function() {
  paused = !paused;
  this.textContent = paused ? "▶ Play" : "⏸ Pause";
};

document.getElementById("speed").onclick = function() {
  speed = speed === 1 ? 3 : speed === 3 ? 6 : 1;
  this.textContent = "⚡ Speed " + speed + "x";
};

document.getElementById("stars").onclick = function() {
  starCount = starCount === 450 ? 1000 : 450;
  createStars();
  this.textContent = starCount === 450
    ? "✨ More Stars" : "✨ Fewer Stars";
};

window.addEventListener("resize", resize);
resize();
animate();
</script>
</body>
</html>
