
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jade Winds - Warrior Upgrade</title>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"}}
</script>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#8fb8c9;color:white;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:9px;left:9px;z-index:2;background:#101a25e8;border:1px solid #9de7cf66;padding:10px;border-radius:11px;font-size:12px}
#hpbar{height:8px;width:150px;background:#55ed91;border-radius:8px;margin-top:5px}
#hpbg{height:8px;width:150px;background:#552525;border-radius:8px;overflow:hidden}
#stick{position:fixed;z-index:3;bottom:20px;left:20px;width:110px;height:110px;border:2px solid #ffffff99;background:#ffffff20;border-radius:50%;touch-action:none}
#knob{position:absolute;left:32px;top:32px;width:42px;height:42px;background:#ffffffdf;border-radius:50%}
.btn{position:fixed;z-index:3;border:2px solid #ffffff9c;border-radius:50%;font-size:10px;font-weight:bold;color:white;touch-action:none}
#attack{right:17px;bottom:23px;width:75px;height:75px;background:#ad3038}
#power{right:18px;bottom:106px;width:58px;height:58px;background:#a26b24}
#jump{right:85px;bottom:106px;width:58px;height:58px;background:#217ca8}
#msg{position:fixed;bottom:153px;left:50%;transform:translateX(-50%);z-index:2;background:#101820ce;padding:8px 11px;border-radius:12px;font-size:11px;white-space:nowrap}
#intro{position:fixed;inset:0;z-index:5;background:linear-gradient(#0d293bd9,#08121df5);display:grid;place-items:center;text-align:center;padding:20px}
#card{max-width:340px;padding:25px;background:#162b3a;border:1px solid #a5ebd488;border-radius:20px}
h1{color:#a5f2d0;letter-spacing:3px}
#play{background:#63e5a2;padding:13px 25px;border:0;border-radius:9px;font-weight:bold}
</style>
</head>
<body>
<div id="hud">
<b style="color:#a5f2d0;letter-spacing:2px">JADE WINDS</b><br>
HP: <span id="hp">100</span>/100
<div id="hpbg"><div id="hpbar"></div></div>
Defeated: <span id="kills">0</span>/3
</div>
<div id="stick"><div id="knob"></div></div>
<button id="attack" class="btn">ATTACK</button>
<button id="power" class="btn">POWER</button>
<button id="jump" class="btn">JUMP</button>
<div id="msg">Enter the forest and defeat the warriors</div>
<div id="intro"><div id="card">
<h1>JADE WINDS</h1>
<p>WARRIOR COMBAT</p>
<p>Explore the ancient forest, master your staff and defeat three enemy warriors.</p>
<p>Move with the joystick. Use ATTACK, POWER and JUMP.</p>
<button id="play">ENTER THE FOREST</button>
</div></div>

<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fc9dc);
scene.fog=new THREE.Fog(0x9fc9dc,48,145);

const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,220);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe4f5ff,0x3e4931,2.2));
const sun=new THREE.DirectionalLight(0xffdfad,3);
sun.position.set(-25,38,24);
scene.add(sun);
const rim=new THREE.DirectionalLight(0x75c9ff,1.15);
rim.position.set(20,14,-24);
scene.add(rim);

const mat=(c,r=.75,m=0)=>new THREE.MeshStandardMaterial({
 color:c,roughness:r,metalness:m
});
const groundMat=mat(0x62864b);
const barkMat=mat(0x573925);
const stoneMat=mat(0x777e7c);
const goldMat=mat(0xe0ba66,.32,.65);
const jadeMat=mat(0x16a987,.28,.25);

function addMesh(parent,geometry,material,x=0,y=0,z=0){
 const o=new THREE.Mesh(geometry,material);
 o.position.set(x,y,z);
 parent.add(o);
 return o;
}

// Environment
const ground=addMesh(scene,new THREE.PlaneGeometry(190,190),groundMat,0,-.12,0);
ground.rotation.x=-Math.PI/2;

for(let i=0;i<125;i++){
 const x=(Math.random()-.5)*100;
 const z=(Math.random()-.5)*115;
 if(Math.abs(x)<5&&z<15&&z>-38)continue;
 const tree=new THREE.Group();
 const h=2.7+Math.random()*2.3;
 addMesh(tree,new THREE.CylinderGeometry(.15,.31,h,8),barkMat,0,h/2,0);
 for(let j=0;j<3;j++){
  addMesh(tree,new THREE.ConeGeometry(1.3-j*.18,1.8,8),
   mat([0x235439,0x327247,0x46824b][j]),0,h*.55+j*.72,0);
 }
 tree.position.set(x,0,z);
 tree.rotation.y=Math.random()*6;
 scene.add(tree);
}

for(let i=0;i<28;i++){
 const h=10+Math.random()*13;
 const m=addMesh(scene,new THREE.ConeGeometry(h*.8,h,7),
  mat(i%2?0x6e918a:0x5b7d7d),
  (Math.random()-.5)*125,h*.4,-48-Math.random()*60);
 m.scale.z=1.35;
}

for(let i=0;i<45;i++){
 const rock=addMesh(scene,new THREE.DodecahedronGeometry(.4+Math.random()*.8),
  stoneMat,(Math.random()-.5)*90,.1,(Math.random()-.5)*95);
 rock.scale.y=.55+Math.random()*.5;
 rock.rotation.set(Math.random(),Math.random(),Math.random());
}

// Procedurally built character. No external model files.
function makeWarrior(enemy=false,color=0x167765){
 const root=new THREE.Group();
 const clothes=mat(color,.64);
 const armor=mat(enemy?0x553d38:0x244653,.4,.28);
 const darkCloth=mat(enemy?0x422927:0x143b34);
 const hair=mat(0x171a20,.8);
 const skin=mat(enemy?0xa96848:0xc88962);
 const metal=mat(enemy?0x9a5a38:0x31bfa0,.3,.35);
 const joints={legs:[],arms:[]};

 // Lower body: upper legs, knees, boots.
 for(const side of [-1,1]){
  const leg=new THREE.Group();
  leg.position.set(side*.19,.79,0);
  root.add(leg);
  joints.legs.push(leg);
  addMesh(leg,new THREE.CapsuleGeometry(.14,.35,4,9),clothes,0,-.18,0);
  addMesh(leg,new THREE.SphereGeometry(.145,12,10),armor,0,-.37,0);
  addMesh(leg,new THREE.BoxGeometry(.30,.16,.40),darkCloth,0,-.48,-.06);
  addMesh(leg,new THREE.BoxGeometry(.30,.055,.13),goldMat,0,-.37,.10);
 }

 // Torso pivot.
 const body=new THREE.Group();
 body.position.y=1.30;
 root.add(body);
 joints.body=body;

 addMesh(body,new THREE.CapsuleGeometry(.32,.48,5,12),clothes);
 addMesh(body,new THREE.BoxGeometry(.66,.20,.43),armor,0,-.20,0);
 addMesh(body,new THREE.BoxGeometry(.72,.10,.46),darkCloth,0,-.34,0);
 addMesh(body,new THREE.BoxGeometry(.70,.07,.47),goldMat,0,-.39,0);

 // Chest armor: layered plates.
 for(let i=0;i<3;i++){
  const plate=addMesh(body,new THREE.BoxGeometry(.48,.13,.09),armor,0,.14-i*.16,.25);
  plate.rotation.x=-.10;
  addMesh(body,new THREE.BoxGeometry(.50,.025,.025),goldMat,0,.19-i*.16,.305);
 }
 addMesh(body,new THREE.SphereGeometry(.10,14,12),metal,0,.10,.33);

 // Neck.
 addMesh(body,new THREE.CylinderGeometry(.10,.12,.18,12),skin,0,.47,0);

 // Head with face, brows, eyes, nose, beard and tied hair.
 const head=new THREE.Group();
 head.position.set(0,.68,0);
 body.add(head);
 joints.head=head;

 addMesh(head,new THREE.SphereGeometry(.245,20,16),skin);
 for(const side of [-1,1]){
  addMesh(head,new THREE.SphereGeometry(.055,10,8),skin,side*.235,0,0);
  addMesh(head,new THREE.SphereGeometry(.030,10,8),mat(0x111318),side*.083,.035,.218);
  addMesh(head,new THREE.BoxGeometry(.085,.025,.025),hair,side*.083,.087,.22);
 }
 addMesh(head,new THREE.ConeGeometry(.045,.13,8),skin,0,-.035,.24);

 const beard=addMesh(head,new THREE.ConeGeometry(.13,.20,8),hair,0,-.19,.10);
 beard.rotation.x=-.12;

 const cap=addMesh(head,new THREE.SphereGeometry(.26,16,12),hair,0,.13,-.025);
 cap.scale.set(1,.54,1);
 addMesh(head,new THREE.ConeGeometry(.085,.32,9),hair,0,.34,-.04);
 const pony=addMesh(head,new THREE.CapsuleGeometry(.065,.38,4,8),hair,0,.06,-.29);
 pony.rotation.x=-.65;

 const band=addMesh(head,new THREE.TorusGeometry(.233,.032,8,24),goldMat,0,.095,0);
 band.rotation.x=.05;

 // Shoulder pads and articulated arms.
 for(const side of [-1,1]){
  const shoulder=addMesh(body,new THREE.SphereGeometry(.205,14,10),armor,side*.43,.23,0);
  shoulder.scale.set(1,.72,1);
  addMesh(body,new THREE.BoxGeometry(.16,.07,.30),goldMat,side*.44,.15,0);
 }

 for(const side of [-1,1]){
  const arm=new THREE.Group();
  arm.position.set(side*.43,.25,0);
  body.add(arm);

  addMesh(arm,new THREE.CapsuleGeometry(.12,.27,4,9),clothes,0,-.17,0);
  addMesh(arm,new THREE.SphereGeometry(.125,12,10),armor,0,-.36,0);

  const forearm=new THREE.Group();
  forearm.position.y=-.37;
  arm.add(forearm);
  addMesh(forearm,new THREE.CapsuleGeometry(.095,.22,4,9),skin,0,-.12,0);
  addMesh(forearm,new THREE.BoxGeometry(.21,.19,.17),armor,0,-.14,.055);
  addMesh(forearm,new THREE.TorusGeometry(.105,.023,7,16),goldMat,0,-.25,0);
  addMesh(forearm,new THREE.SphereGeometry(.10,12,10),skin,0,-.29,0);

  joints.arms.push({arm,forearm});
 }

 // Belt and hanging cloth panels.
 addMesh(body,new THREE.TorusGeometry(.31,.045,8,24),goldMat,0,-.44,0);
 for(const side of [-1,1]){
  const panel=addMesh(body,new THREE.BoxGeometry(.21,.42,.075),darkCloth,side*.21,-.64,.07);
  panel.rotation.z=side*.13;
  addMesh(body,new THREE.BoxGeometry(.21,.045,.085),goldMat,side*.21,-.43,.09);
 }

 // Staff with metal caps.
 const weapon=new THREE.Group();
 weapon.position.set(.54,-.59,.03);
 weapon.rotation.z=-.18;
 body.add(weapon);
 joints.weapon=weapon;
 addMesh(weapon,new THREE.CylinderGeometry(.035,.05,1.38,10),
  mat(0x80532e,.42),0,-.13,0);
 for(const y of [-.72,.46]){
  addMesh(weapon,new THREE.CylinderGeometry(.065,.065,.09,10),goldMat,0,y,0);
 }
 addMesh(weapon,new THREE.ConeGeometry(.065,.17,9),goldMat,0,.60,0);

 // Scabbard on the back.
 const sheath=addMesh(body,new THREE.CylinderGeometry(.045,.06,.85,8),
  darkCloth,-.23,-.12,-.22);
 sheath.rotation.x=.25;
 sheath.rotation.z=-.20;

 root.userData={
  joints,hp:100,enemy,
  phase:Math.random()*6,
  attackTimer:Math.random()*.5,
  action:'idle',actionTime:0,hitFlash:0
 };
 return root;
}

const player=makeWarrior(false,0x137b67);
player.position.set(0,0,5);
scene.add(player);

const enemies=[];
const enemyColors=[0x87352d,0x584181,0x94702c];
for(let i=0;i<3;i++){
 const e=makeWarrior(true,enemyColors[i]);
 e.position.set((i-1)*4,0,-5-i*6);
 scene.add(e);
 enemies.push(e);
}

// Floating jade shrine.
const shrine=new THREE.Group();
addMesh(shrine,new THREE.CylinderGeometry(1.15,1.45,.4,8),
 mat(0x737c79),0,.2,0);
const crystal=addMesh(shrine,new THREE.OctahedronGeometry(.62),
 new THREE.MeshStandardMaterial({
  color:0x7effdc,emissive:0x087a5a,emissiveIntensity:1.5,
  metalness:.25,roughness:.2
 }),0,1.15,0);
shrine.position.set(8,0,-25);
scene.add(shrine);

// Game state.
let started=false,hp=100,kills=0;
let jumpV=0,grounded=true;
let attackCD=0,powerCD=0,invulnerable=0;
let elapsed=0,walkTime=0;
let joyX=0,joyY=0,stickPointer=null;
const keys={};

const hpText=document.querySelector('#hp');
const hpBar=document.querySelector('#hpbar');
const killsText=document.querySelector('#kills');
const msg=document.querySelector('#msg');

function updateHUD(){
 hpText.textContent=Math.ceil(hp);
 hpBar.style.width=hp+'%';
 hpBar.style.background=hp<30?'#ff5148':'#55ed91';
 killsText.textContent=kills;
}

function setAction(character,name,duration){
 const u=character.userData;
 u.action=name;
 u.actionTime=duration;
}

function hitEnemies(damage,range){
 let hit=false;
 for(const e of enemies){
  if(!e.visible)continue;
  if(e.position.distanceTo(player.position)<range){
   e.userData.hp-=damage;
   setAction(e,'hit',.22);
   e.userData.hitFlash=.2;
   hit=true;
   if(e.userData.hp<=0){
    e.visible=false;
    kills++;
    msg.textContent='Warrior defeated!';
   }else{
    msg.textContent=damage>35?'POWER STRIKE!':'Clean hit!';
   }
  }
 }
 if(!hit)msg.textContent='Move closer to the enemy';
 updateHUD();
}

function attack(power=false){
 if(!started||hp<=0)return;
 if(power){
  if(powerCD>0)return;
  powerCD=1.05;
  setAction(player,'power',.45);
  hitEnemies(45,3.6);
 }else{
  if(attackCD>0)return;
  attackCD=.42;
  setAction(player,'attack',.32);
  hitEnemies(24,3.2);
 }
}

document.querySelector('#attack').addEventListener('pointerdown',e=>{
 e.preventDefault();attack(false);
});
document.querySelector('#power').addEventListener('pointerdown',e=>{
 e.preventDefault();attack(true);
});
document.querySelector('#jump').addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(started&&grounded&&hp>0){
  jumpV=7;grounded=false;
  setAction(player,'jump',.25);
 }
});

const stick=document.querySelector('#stick');
const knob=document.querySelector('#knob');

function setJoystick(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-r.left-r.width/2;
 let dy=e.clientY-r.top-r.height/2;
 const length=Math.hypot(dx,dy),max=35;
 if(length>max){dx=dx/length*max;dy=dy/length*max;}
 joyX=dx/max;joyY=dy/max;
 knob.style.transform=`translate(${dx}px,${dy}px)`;
}
function resetJoystick(){
 joyX=0;joyY=0;stickPointer=null;
 knob.style.transform='translate(0,0)';
}
stick.addEventListener('pointerdown',e=>{
 e.preventDefault();stickPointer=e.pointerId;
 stick.setPointerCapture(e.pointerId);setJoystick(e);
});
stick.addEventListener('pointermove',e=>{
 if(e.pointerId===stickPointer)setJoystick(e);
});
stick.addEventListener('pointerup',resetJoystick);
stick.addEventListener('pointercancel',resetJoystick);

addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==='Space'&&started&&grounded){jumpV=7;grounded=false;setAction(player,'jump',.25);}
 if(e.key.toLowerCase()==='f')attack(false);
 if(e.key.toLowerCase()==='g')attack(true);
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

document.querySelector('#play').addEventListener('click',()=>{
 started=true;
 document.querySelector('#intro').style.display='none';
 msg.textContent='Defeat all three warriors!';
});

const clock=new THREE.Clock();
const lookAt=new THREE.Vector3();
const camTarget=new THREE.Vector3();

function animateCharacter(c,dt,moving,phase){
 const u=c.userData,j=u.joints;
 u.phase+=dt*(moving?9:2.2);
 u.actionTime=Math.max(0,u.actionTime-dt);
 u.hitFlash=Math.max(0,u.hitFlash-dt);
 const swing=Math.sin(u.phase)*.64*(moving?1:0);
 const idle=Math.sin(elapsed*1.5)*.025;

 // Base locomotion.
 j.legs[0].rotation.x=swing;
 j.legs[1].rotation.x=-swing;
 j.arms[0].arm.rotation.x=-swing*.65;
 j.arms[1].arm.rotation.x=swing*.65;
 j.body.position.y=1.30+(moving?Math.abs(Math.sin(u.phase*2))*.035:idle);
 j.head.rotation.z=Math.sin(elapsed*1.3+phase)*.025;

 // Return to default pose before applying an action.
 j.body.rotation.x=THREE.MathUtils.lerp(j.body.rotation.x,0,dt*7);
 j.body.rotation.z=THREE.MathUtils.lerp(j.body.rotation.z,0,dt*7);
 j.weapon.rotation.x=THREE.MathUtils.lerp(j.weapon.rotation.x,0,dt*6);
 j.weapon.rotation.z=THREE.MathUtils.lerp(j.weapon.rotation.z,-.18,dt*6);
 for(const a of j.arms){
  a.arm.rotation.z=THREE.MathUtils.lerp(a.arm.rotation.z,0,dt*7);
  a.forearm.rotation.x=THREE.MathUtils.lerp(a.forearm.rotation.x,0,dt*7);
 }

 // Staff swings with torso and arm follow-through.
 if(u.action==='attack'&&u.actionTime>0){
  const t=u.actionTime/.32;
  const swingAngle=Math.sin((1-t)*Math.PI);
  j.body.rotation.y=.65*swingAngle;
  j.body.rotation.x=-.18*swingAngle;
  j.arms[1].arm.rotation.x=-1.25*swingAngle;
  j.arms[1].arm.rotation.z=-.6*swingAngle;
  j.weapon.rotation.x=-1.8*swingAngle;
  j.weapon.rotation.z=-.18-1.1*swingAngle;
 }else if(u.action==='power'&&u.actionTime>0){
  const t=u.actionTime/.45;
  const a=Math.sin((1-t)*Math.PI);
  j.body.rotation.y=.95*a;
  j.body.rotation.x=-.3*a;
  j.arms[1].arm.rotation.x=-1.65*a;
  j.arms[0].arm.rotation.x=-.8*a;
  j.weapon.rotation.x=-2.2*a;
  j.weapon.rotation.z=-.18-1.35*a;
 }else if(u.action==='hit'&&u.actionTime>0){
  j.body.rotation.x=.25;
  j.body.rotation.z=.2*Math.sin(u.actionTime*18);
 }else if(u.action==='jump'&&u.actionTime>0){
  j.arms[0].arm.rotation.x=-.8;
  j.arms[1].arm.rotation.x=-.8;
  j.legs[0].rotation.x=-.4;
  j.legs[1].rotation.x=.4;
 }
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 elapsed+=dt;
 crystal.rotation.y+=dt*.7;
 crystal.position.y=1.15+Math.sin(elapsed*2)*.12;

 attackCD=Math.max(0,attackCD-dt);
 powerCD=Math.max(0,powerCD-dt);
 invulnerable=Math.max(0,invulnerable-dt);

 let moving=false;

 if(started&&hp>0){
  let x=joyX,y=joyY;
  if(keys.a||keys.arrowleft)x-=1;
  if(keys.d||keys.arrowright)x+=1;
  if(keys.w||keys.arrowup)y-=1;
  if(keys.s||keys.arrowdown)y+=1;
  const len=Math.hypot(x,y);
  if(len>1){x/=len;y/=len;}
  moving=len>.08;

  if(moving){
   player.position.x+=x*5.1*dt;
   player.position.z+=y*5.1*dt;
   player.rotation.y=Math.atan2(-x,-y);
   walkTime+=dt*10;
  }

  player.position.x=THREE.MathUtils.clamp(player.position.x,-42,42);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-48,34);

  jumpV-=17*dt;
  player.position.y+=jumpV*dt;
  if(player.position.y<=0){
   player.position.y=0;jumpV=0;grounded=true;
  }

  animateCharacter(player,dt,moving,0);

  // Enemy movement and counterattacks.
  for(const e of enemies){
   if(!e.visible)continue;
   const d=new THREE.Vector3().subVectors(player.position,e.position);
   d.y=0;
   const distance=d.length();
   let enemyMoving=false;

   if(distance>1.65&&distance<40){
    d.normalize();
    e.position.addScaledVector(d,1.2*dt);
    e.rotation.y=Math.atan2(-d.x,-d.z);
    enemyMoving=true;
   }else if(distance<=1.8){
    e.userData.attackTimer-=dt;
    if(e.userData.attackTimer<=0&&invulnerable<=0){
     hp=Math.max(0,hp-7);
     invulnerable=.6;
     e.userData.attackTimer=1.15;
     setAction(e,'attack',.3);
     msg.textContent=hp>0?'Enemy hit you!':'Defeated! Refresh to restart.';
     updateHUD();
    }
   }
   animateCharacter(e,dt,enemyMoving,1);
  }
 }else{
  animateCharacter(player,dt,false,0);
 }

 lookAt.set(player.position.x,player.position.y+1.25,player.position.z);
 camTarget.set(player.position.x,player.position.y+4.0,player.position.z+7.6);
 camera.position.lerp(camTarget,1-Math.exp(-4.5*dt));
 camera.lookAt(lookAt);
 renderer.render(scene,camera);
}

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});

updateHUD();
animate();
</script>
</body>
</html>
