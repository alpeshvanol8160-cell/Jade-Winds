
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jade Winds 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#182a32;font-family:Arial;color:white;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;background:#102020dd;padding:12px;border-radius:12px;font-size:14px;z-index:2}
#health{width:130px;height:9px;background:#572626;border-radius:9px;margin-top:5px;overflow:hidden}
#bar{height:100%;width:100%;background:#39db76}
#stick{position:fixed;bottom:22px;left:22px;width:112px;height:112px;border:2px solid #ffffff90;background:#ffffff25;border-radius:50%;z-index:3;touch-action:none}
#knob{position:absolute;width:44px;height:44px;left:32px;top:32px;background:#ffffffd0;border-radius:50%}
.btn{position:fixed;z-index:3;right:20px;border:2px solid #ffffffa0;border-radius:50%;color:white;font-weight:bold;touch-action:none}
#attack{bottom:25px;width:76px;height:76px;background:#b83c35}
#jump{bottom:110px;right:92px;width:58px;height:58px;background:#247da8}
#start{position:fixed;inset:0;background:#07131dcc;z-index:5;display:grid;place-items:center;text-align:center;padding:22px}
#card{max-width:340px;background:#182a35;padding:24px;border-radius:18px;border:1px solid #ffffff50}
#play{background:#55dc91;border:0;padding:13px 30px;border-radius:10px;font-weight:bold;font-size:16px}
#msg{position:fixed;bottom:160px;left:50%;transform:translateX(-50%);z-index:2;background:#101820bb;padding:7px 12px;border-radius:15px;font-size:12px;white-space:nowrap}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="hud"><b>JADE WINDS</b><br>HP: <span id="hp">100</span>/100<div id="health"><div id="bar"></div></div>Defeated: <span id="kills">0</span>/3</div>
<div id="stick"><div id="knob"></div></div>
<button id="jump" class="btn">JUMP</button>
<button id="attack" class="btn">ATTACK</button>
<div id="msg">Move close to enemies and attack</div>
<div id="start"><div id="card"><h1>JADE WINDS</h1><p>3D Fantasy Fighting Prototype</p><p>Automatically created camera, forest, player, enemies and touch controls.</p><button id="play">PLAY GAME</button></div></div>
<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c9df);
scene.fog=new THREE.Fog(0x91c9df,35,105);

const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,160);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe0f4ff,0x3a5030,2));
const sun=new THREE.DirectionalLight(0xffe7c4,2);
sun.position.set(-15,25,12);scene.add(sun);

function material(c){return new THREE.MeshStandardMaterial({color:c,roughness:.9})}

const floor=new THREE.Mesh(new THREE.PlaneGeometry(150,150),material(0x4f8048));
floor.rotation.x=-Math.PI/2;floor.position.y=-.1;scene.add(floor);

const path=new THREE.Mesh(new THREE.PlaneGeometry(7,100),material(0x99886a));
path.rotation.x=-Math.PI/2;path.position.set(0,-.08,-20);scene.add(path);

// Automatically create distant hills
for(let i=0;i<18;i++){
 const hill=new THREE.Mesh(new THREE.SphereGeometry(1,12,9),material(i%2?0x628b68:0x739b76));
 hill.scale.set(8+Math.random()*8,3+Math.random()*4,7+Math.random()*8);
 hill.position.set((Math.random()-.5)*110,-1.5,-40-Math.random()*60);
 scene.add(hill);
}

// Automatically create forest
for(let i=0;i<65;i++){
 const x=(Math.random()-.5)*85,z=(Math.random()-.5)*90;
 if(Math.abs(x)<5&&z<8&&z>-40)continue;
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.15,.24,1.7,7),material(0x65462b));
 trunk.position.set(x,.8,z);scene.add(trunk);
 const leaves=new THREE.Mesh(new THREE.ConeGeometry(1.1,3,7),material(0x2e7045));
 leaves.position.set(x,2.7,z);scene.add(leaves);
}

// Build characters from 3D shapes, so external models aren't needed
function createWarrior(color,enemy=false){
 const group=new THREE.Group();
 function part(geo,c,x,y,z){
  const m=new THREE.Mesh(geo,material(c));m.position.set(x,y,z);group.add(m);return m;
 }
 part(new THREE.CapsuleGeometry(.34,.65,4,8),color,0,1.15,0);
 part(new THREE.SphereGeometry(.27,12,10),0xd5a77e,0,1.85,0);
 part(new THREE.SphereGeometry(.28,10,8),0x211b19,0,2.04,0);
 part(new THREE.BoxGeometry(.68,.13,.4),enemy?0xb84637:0xe0c254,0,.9,0);
 for(const s of [-1,1]){
  part(new THREE.CapsuleGeometry(.13,.4,3,6),color,s*.43,1.25,0);
  part(new THREE.CapsuleGeometry(.15,.4,3,6),0x29323c,s*.18,.4,0);
 }
 const sword=part(new THREE.BoxGeometry(.08,.72,.12),0xe4ebf0,.62,1.18,0);
 group.userData.sword=sword;
 group.userData.hp=100;
 group.userData.cool=0;
 return group;
}

const player=createWarrior(0x2466b0);
player.position.set(0,0,4);scene.add(player);

const enemies=[];
for(let i=0;i<3;i++){
 const e=createWarrior([0xa63e35,0x80438b,0xa27432][i],true);
 e.position.set((i-1)*4,0,-5-i*5);
 scene.add(e);enemies.push(e);
}

let hp=100,kills=0,started=false,jumpV=0,grounded=true,attackCD=0,invulnerable=0;
const hpEl=document.querySelector('#hp');
const bar=document.querySelector('#bar');
const killsEl=document.querySelector('#kills');
const msg=document.querySelector('#msg');

function updateHUD(){
 hpEl.textContent=Math.ceil(hp);
 bar.style.width=Math.max(0,hp)+'%';
 killsEl.textContent=kills;
}
function attack(){
 if(!started||attackCD>0||hp<=0)return;
 attackCD=.45;
 let hit=false;
 for(const e of enemies){
  if(!e.visible)continue;
  if(e.position.distanceTo(player.position)<2.6){
   e.userData.hp-=35;hit=true;
   if(e.userData.hp<=0){
    e.visible=false;kills++;
    msg.textContent='Warrior defeated!';
   }
  }
 }
 if(!hit)msg.textContent='Move closer to an enemy';
 updateHUD();
}
document.querySelector('#attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});
document.querySelector('#jump').addEventListener('pointerdown',e=>{
 e.preventDefault();if(grounded&&started&&hp>0){jumpV=6.5;grounded=false}
});

// Touch joystick
const stick=document.querySelector('#stick');
const knob=document.querySelector('#knob');
let joy={x:0,y:0},pointer=null;
function setJoy(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
 const len=Math.hypot(dx,dy),max=36;
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 joy={x:dx/max,y:dy/max};
 knob.style.transform=`translate(${dx}px,${dy}px)`;
}
function resetJoy(){joy={x:0,y:0};pointer=null;knob.style.transform='translate(0,0)'}
stick.addEventListener('pointerdown',e=>{e.preventDefault();pointer=e.pointerId;stick.setPointerCapture(pointer);setJoy(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===pointer)setJoy(e)});
stick.addEventListener('pointerup',resetJoy);
stick.addEventListener('pointercancel',resetJoy);

// Keyboard controls for desktop testing
const keys={};
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==='Space'&&grounded){jumpV=6.5;grounded=false}
 if(e.key.toLowerCase()==='f')attack();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

document.querySelector('#play').addEventListener('click',()=>{
 started=true;document.querySelector('#start').style.display='none';
});

const clock=new THREE.Clock();
const target=new THREE.Vector3(),cameraPosition=new THREE.Vector3();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 if(started&&hp>0){
  attackCD=Math.max(0,attackCD-dt);
  invulnerable=Math.max(0,invulnerable-dt);

  let x=joy.x,y=joy.y;
  if(keys.a||keys.arrowleft)x-=1;
  if(keys.d||keys.arrowright)x+=1;
  if(keys.w||keys.arrowup)y-=1;
  if(keys.s||keys.arrowdown)y+=1;
  const len=Math.hypot(x,y);
  if(len>1){x/=len;y/=len}

  if(len>.08){
   player.position.x+=x*5*dt;
   player.position.z+=y*5*dt;
   player.rotation.y=Math.atan2(-x,-y);
  }
  player.position.x=THREE.MathUtils.clamp(player.position.x,-40,40);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-45,30);

  jumpV-=16*dt;player.position.y+=jumpV*dt;
  if(player.position.y<=0){player.position.y=0;jumpV=0;grounded=true}

  for(const e of enemies){
   if(!e.visible)continue;
   const direction=new THREE.Vector3().subVectors(player.position,e.position);
   direction.y=0;
   const distance=direction.length();
   if(distance>1.5&&distance<35){
    direction.normalize();
    e.position.addScaledVector(direction,1.25*dt);
    e.rotation.y=Math.atan2(-direction.x,-direction.z);
   }else if(distance<=1.6){
    e.userData.cool-=dt;
    if(e.userData.cool<=0&&invulnerable<=0){
     hp=Math.max(0,hp-7);invulnerable=.7;e.userData.cool=1.2;
     updateHUD();
     msg.textContent=hp>0?'Enemy attacked you!':'Defeated — refresh to restart';
    }
   }
  }
 }

 target.set(player.position.x,player.position.y+1.25,player.position.z);
 cameraPosition.set(player.position.x,player.position.y+4.2,player.position.z+7.8);
 camera.position.lerp(cameraPosition,1-Math.exp(-5*dt));
 camera.lookAt(target);
 renderer.render(scene,camera);
}

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
updateHUD();animate();
</script>
</body>
</html>
